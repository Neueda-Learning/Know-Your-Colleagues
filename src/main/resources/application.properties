spring.application.name=Know-Your-Colleagues

spring.datasource.url=jdbc:mysql://localhost:3306/transaction_monitoring?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=your-password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=mqadmin
spring.rabbitmq.password=your-password
spring.rabbitmq.virtual-host=/

# Dashboard WebSocket refresh tiers
dashboard.websocket.operations-interval-ms=5000
dashboard.websocket.transactions-interval-ms=15000
dashboard.websocket.sla-interval-ms=60000
